<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2D53B5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finances">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Mes Finances</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: banking-app shell — royal-blue header with balance and round quick actions, light rounded panel of soft cards, bottom tab bar with a raised centre + */
:root{
  --brand:#2D53B5; --brand-2:#1C3C93; --brand-soft:#E6ECFA; --on-brand:#FFFFFF;
  --bg:#F1F4FA; --surface:#FFFFFF; --sunk:#EAEEF6; --ink:#18213D; --muted:#7C86A2; --line:#E3E8F2;
  --good:#1F9D67; --good-soft:#DDF3E8; --bad:#E0484E; --bad-soft:#FBE3E4; --warn:#D98A1C; --warn-soft:#FBEED8;
  --gold:#B8861F; --gold-soft:#F6EBD2;
  --c1:#2D53B5; --c2:#D98A1C; --c3:#1F9D67; --c4:#E0484E; --c5:#7B5CC9; --c6:#1C9BB0; --c7:#C2508E; --c8:#6F8A2C; --c9:#8C93A8;
  --shadow:0 6px 18px rgb(30 52 120 / .07);
  --font:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --brand:#4E78E0; --brand-2:#2A4AA6; --brand-soft:#1C2847; --on-brand:#FFFFFF;
  --bg:#0C1120; --surface:#151C30; --sunk:#1D263D; --ink:#E9EDF7; --muted:#8E98B5; --line:#252F48;
  --good:#4CC98F; --good-soft:#123528; --bad:#F27A7E; --bad-soft:#3A1B1F; --warn:#F2AC4B; --warn-soft:#3A2B12;
  --gold:#E2B656; --gold-soft:#372C15;
  --c1:#6F95F0; --c2:#F2AC4B; --c3:#4CC98F; --c4:#F27A7E; --c5:#A98CF0; --c6:#4FC3D4; --c7:#E68CBF; --c8:#B0C766; --c9:#9AA2B8;
  --shadow:0 6px 18px rgb(0 0 0 / .25); color-scheme:dark}}
:root[data-theme="dark"]{
  --brand:#4E78E0; --brand-2:#2A4AA6; --brand-soft:#1C2847; --on-brand:#FFFFFF;
  --bg:#0C1120; --surface:#151C30; --sunk:#1D263D; --ink:#E9EDF7; --muted:#8E98B5; --line:#252F48;
  --good:#4CC98F; --good-soft:#123528; --bad:#F27A7E; --bad-soft:#3A1B1F; --warn:#F2AC4B; --warn-soft:#3A2B12;
  --gold:#E2B656; --gold-soft:#372C15;
  --c1:#6F95F0; --c2:#F2AC4B; --c3:#4CC98F; --c4:#F27A7E; --c5:#A98CF0; --c6:#4FC3D4; --c7:#E68CBF; --c8:#B0C766; --c9:#9AA2B8;
  --shadow:0 6px 18px rgb(0 0 0 / .25); color-scheme:dark}

html{-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.shell{max-width:560px;margin:0 auto;min-height:100vh;position:relative}

/* Header */
.hero{background:linear-gradient(160deg,var(--brand) 0%,var(--brand-2) 100%);color:var(--on-brand);padding:calc(14px + env(safe-area-inset-top,0px)) 18px 44px;display:flex;flex-direction:column;gap:16px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.segw{display:flex;background:rgb(255 255 255 / .14);border-radius:12px;padding:3px;gap:2px}
.segw button{border:0;background:transparent;color:rgb(255 255 255 / .8);padding:7px 12px;border-radius:9px;font-weight:700;font-size:13px}
.segw button[aria-pressed="true"]{background:#fff;color:var(--brand-2)}
.hicons{display:flex;gap:10px;align-items:center}
.iconbtn{position:relative;border:0;background:rgb(255 255 255 / .14);color:#fff;width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.badge{position:absolute;top:6px;right:7px;min-width:16px;height:16px;border-radius:99px;background:#FF6B6B;color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.avatar{border-radius:14px;object-fit:cover;display:grid;place-items:center;font-weight:800;color:#fff;flex:none;overflow:hidden}
.hero .avatar{width:42px;height:42px;border:2px solid rgb(255 255 255 / .6)}
.mnav{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px;color:rgb(255 255 255 / .85)}
.mnav button{border:0;background:none;color:inherit;padding:4px 6px;font-size:18px;line-height:1}
.mnav span{text-transform:capitalize}
.bal{font-weight:800;font-size:clamp(32px,10vw,40px);letter-spacing:-.02em;line-height:1.05}
.bal small{font-size:.42em;font-weight:600;opacity:.85;margin-left:6px}
.ballbl{font-size:13px;color:rgb(255 255 255 / .78);margin-top:4px}
.syncchip{border:0;background:rgb(255 255 255 / .14);color:#fff;border-radius:99px;padding:5px 11px 5px 9px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:7px;margin-top:10px;max-width:100%}
.syncchip i{width:8px;height:8px;border-radius:50%;background:#9AA6C4;flex:none}
.syncchip.ok i{background:#5BE0A0} .syncchip.wait i{background:#FFC25C} .syncchip.err i{background:#FF8A8A}
.syncline{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600}
.syncline i{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.syncline.ok i{background:var(--good)} .syncline.wait i{background:var(--warn)} .syncline.err i{background:var(--bad)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{border:0;background:none;color:#fff;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;font-weight:600}
.quick span.q{width:54px;height:54px;border-radius:16px;background:#fff;color:var(--brand);display:grid;place-items:center;box-shadow:0 6px 14px rgb(0 0 0 / .12)}
.quick svg.i{width:24px;height:24px}
.subhero{padding-bottom:40px;gap:10px}
.subhero h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.subhero p{margin:0;font-size:13.5px;color:rgb(255 255 255 / .8)}
.panel{background:var(--bg);border-radius:26px 26px 0 0;margin-top:-26px;position:relative;padding:18px 16px calc(110px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}

/* Cards and lists */
.card{background:var(--surface);border-radius:18px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ch h2,.sec{margin:0;font-size:16.5px;font-weight:800;letter-spacing:-.01em}
.link{border:0;background:none;color:var(--brand);font-weight:700;font-size:13.5px;padding:4px 0}
.muted{color:var(--muted)} .small{font-size:12.5px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 13px;font-size:13px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.chip[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand);border-color:transparent}
.grp{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:2px 2px -4px}
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%}
.list > .row:first-child{border-top:0;padding-top:2px}
.ico{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--sunk)}
.row .t{min-width:0}
.row .t b{display:block;font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t .bar{display:block}
.row .t span{display:block;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .a{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-weight:700;font-size:14.5px}
.row .a span{font-size:12px;color:var(--muted);font-weight:500}
.pos{color:var(--good)} .neg{color:var(--bad)}
.pill{font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;white-space:nowrap;display:inline-block}
.pill.ok{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--brand-soft);color:var(--brand)} .pill.gold{background:var(--gold-soft);color:var(--gold)}
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.bar.good i{background:var(--good)} .bar.warn i{background:var(--warn)} .bar.bad i{background:var(--bad)} .bar.gold i{background:var(--gold)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv div{background:var(--sunk);border-radius:13px;padding:10px 12px;min-width:0}
.kv span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.kv b{display:block;font-size:16px;font-weight:800;overflow:hidden;text-overflow:ellipsis}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:0;background:var(--surface);border-radius:18px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;text-align:left;min-width:0}
.tile .ico{width:42px;height:42px;background:var(--brand-soft);color:var(--brand)}
.tile b{font-size:14.5px} .tile span{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:13px;padding:11px 15px;font-weight:700;font-size:14px;background:var(--brand);color:var(--on-brand);display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn svg.i{width:18px;height:18px}
.btn.soft{background:var(--brand-soft);color:var(--brand)}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.wa{background:#1FAF5A;color:#fff}
.btn.wide{width:100%;padding:14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.empty{text-align:center;color:var(--muted);padding:22px 10px;font-size:14px}
.banner{background:var(--gold-soft);border-radius:16px;padding:12px 14px;font-size:13.5px}
.banner b{color:var(--gold)}
.alert{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.alert:first-of-type{border-top:0;padding-top:0}
.alert .ico{width:38px;height:38px;border-radius:11px}
.alert b{font-size:14px;display:block} .alert span{font-size:12.5px;color:var(--muted);display:block}

/* Bank cards */
.cards{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 10px;margin:0 -2px}
.bcard{flex:0 0 min(82%,320px);scroll-snap-align:start;border:0;text-align:left;color:#fff;border-radius:20px;padding:18px;min-height:176px;display:flex;flex-direction:column;justify-content:space-between;background:radial-gradient(120% 120% at 100% 0%,#3C66CF 0%,#1B347F 55%,#13275E 100%);box-shadow:0 12px 24px rgb(20 40 110 / .28);position:relative;overflow:hidden}
.bcard[aria-pressed="false"]{opacity:.6}
.bcard .bk{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:15px}
.bcard .no{font-size:17px;letter-spacing:.14em;font-weight:700}
.bcard .ft{display:flex;justify-content:space-between;gap:10px;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;opacity:.75}
.bcard .ft b{display:block;font-size:14px;letter-spacing:0;text-transform:none;opacity:1;margin-top:2px}
.bcard.add{background:var(--surface);color:var(--muted);border:2px dashed var(--line);box-shadow:none;align-items:center;justify-content:center;gap:8px;font-weight:700}

/* Charts */
.donutwrap{display:grid;grid-template-columns:130px 1fr;gap:14px;align-items:center}
@media (max-width:370px){.donutwrap{grid-template-columns:1fr;justify-items:center}}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;width:100%;min-width:0}
.legend li{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center;font-size:13px}
.legend li span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font)}
.tablewrap{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:420px}
th,td{padding:8px 6px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:700;border-top:0;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
th:first-child,td:first-child{text-align:left}
tr.paid td{color:var(--muted)}

/* Bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);box-shadow:0 -4px 18px rgb(20 40 100 / .07);padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted);padding:6px 0}
nav.tabs button[aria-current="page"]{color:var(--brand)}
nav.tabs .plus span{width:52px;height:52px;border-radius:17px;background:var(--brand);color:#fff;display:grid;place-items:center;margin-top:-26px;box-shadow:0 8px 18px rgb(45 83 181 / .4)}

/* Sheets */
.scrim{position:fixed;inset:0;background:rgb(10 16 35 / .5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:92vh;overflow-y:auto}
.sheet h3{margin:0;font-size:19px;font-weight:800}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);align-self:center;margin-top:-6px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.field input,.field select{border:1px solid var(--line);background:var(--bg);border-radius:13px;padding:12px;font-size:16px;width:100%;min-width:0}
.field input.amount{font-size:24px;font-weight:800}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.segf{display:flex;gap:8px;flex-wrap:wrap}
.segf button{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 8px;font-weight:700;font-size:14px;min-width:0}
.segf button[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.err{color:var(--bad);font-size:13px;margin:0}
.menu{display:flex;flex-direction:column;gap:6px}
.menu button{display:grid;grid-template-columns:42px 1fr;gap:12px;align-items:center;border:0;background:var(--bg);border-radius:14px;padding:10px 12px;text-align:left}
.menu .ico{width:42px;height:42px;background:var(--brand-soft);color:var(--brand)}
.menu b{display:block;font-size:14.5px} .menu span{font-size:12.5px;color:var(--muted)}
.pick{display:flex;flex-direction:column;gap:2px;max-height:50vh;overflow-y:auto}
.pick label{display:grid;grid-template-columns:22px 36px 1fr;gap:10px;align-items:center;padding:8px 4px;border-top:1px solid var(--line)}
.pick label .avatar{width:36px;height:36px;border-radius:11px;font-size:13px}
.pick input{width:18px;height:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:13px;font-size:14px;z-index:40;max-width:calc(100% - 32px);text-align:center}
.lock{position:fixed;inset:0;z-index:50;background:linear-gradient(160deg,var(--brand),var(--brand-2));color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px}
.lock .avatar{width:76px;height:76px;border-radius:24px;font-size:26px;border:3px solid rgb(255 255 255 / .6)}
.pins{display:flex;gap:14px}.pins i{width:14px;height:14px;border-radius:50%;border:2px solid #fff;display:block}.pins i.f{background:#fff}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.pad button{height:72px;border-radius:50%;border:0;background:rgb(255 255 255 / .14);color:#fff;font-size:24px;font-weight:700}
.profilehead{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.profilehead .avatar{width:96px;height:96px;border-radius:30px;font-size:34px;border:4px solid var(--surface);box-shadow:var(--shadow)}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.toggle:first-of-type{border-top:0}
.toggle b{display:block;font-size:14.5px} .toggle span{font-size:12.5px;color:var(--muted)}
.sw{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgb(0 0 0 / .2)}
.sw:checked{background:var(--good)} .sw:checked::after{left:21px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
@media (prefers-reduced-motion:reduce){.sw,.sw::after{transition:none}}
</style>
</head>
<body>
<div class="shell" id="app"></div>
<div id="sheetRoot"></div>
<div id="lockRoot"></div>

async function api(action, payload){
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 45000);
  try {
    const r = await fetch(cfg.url, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(Object.assign({key:cfg.key, action}, payload||{})), signal: ctl.signal, redirect:"follow"});
    let j; try { j = await r.json(); } catch(e){ throw new Error("Réponse illisible du serveur : vérifie l'adresse et que l'accès est sur « Tout le monde »."); }
    if (!j.ok) throw new Error(j.error === "BAD_KEY" ? "Clé secrète incorrecte." : (j.error || "Erreur du serveur"));
    return j;
  } finally { clearTimeout(t); }
}
const ago = ts => { if (!ts) return "jamais"; const m = Math.round((Date.now()-ts)/60000); return m<1 ? "à l'instant" : m<60 ? `il y a ${m} min` : m<1440 ? `il y a ${Math.round(m/60)} h` : "le " + new Date(ts).toLocaleDateString("fr-FR",{day:"numeric",month:"short"}); };
function syncStatus(){
  const n = pendingCount(), w = n ? ` · ${n} modification${n>1?"s":""} en attente` : "";
  if (!cfg) return {c:"", t: usingSamples() ? "Données d'exemple" : "Sur ce téléphone · synchro non configurée"};
  if (syncing) return {c:"wait", t:"Synchronisation…"};
  if (!navigator.onLine) return {c:"wait", t:"Hors ligne" + w};
  if (syncErr) return {c:"err", t:"Synchro en échec" + w};

function scheduleSync(delay=1200){ clearTimeout(syncTimer); syncUI(); if (cfg) syncTimer = setTimeout(sync, delay); }
async function sync(){
  if (!cfg || syncing) return;
  if (!navigator.onLine) { syncUI(); return; }
  syncing = true; syncUI();
  const items = Object.values(outbox), sendPhoto = meta.photoPending ? state.photo : null;
  try {
    const res = await api("sync", {items, photoV: meta.photoV || 0, photo: sendPhoto});
    items.forEach(it => { if (outbox[it.id] && outbox[it.id]._u === it._u) delete outbox[it.id]; });
    const m = new Map(res.docs);
    Object.values(outbox).forEach(it => it.del ? m.delete(it.id) : m.set(it.id, it.data));
    const changed = JSON.stringify([...m].sort()) !== JSON.stringify([...state.docs].sort());
    state.docs = m;
    if (sendPhoto !== null && state.photo === sendPhoto) meta.photoPending = false;
    let photoChanged = false;
    if (typeof res.photo === "string" && !meta.photoPending) { state.photo = res.photo; ls.set(K.photo, res.photo); photoChanged = true; }
    meta.photoV = res.photoV || 0; meta.lastSync = Date.now(); syncErr = "";
    if (res.email) cfg.email = state.email = res.email;
    if (res.sheetUrl) cfg.sheetUrl = state.sheetUrl = res.sheetUrl;
    ls.set(K.cfg, cfg); persistAll();
    if (changed || photoChanged) render();
  } catch(e){ syncErr = e && e.name === "AbortError" ? "Délai dépassé" : (e && e.message) || "Erreur"; }
  syncing = false; syncUI();
  if (!syncErr && Object.keys(outbox).length) scheduleSync(400);
}
function readable(id, d){

    case "tx": return [sp, d.type==="in"?"Revenu":"Dépense", d.date, d.amount, catName(d.space,d.type,d.cat), d.method||"", d.note||"", d.contactId?contactName(d.contactId):"", d.contractId?((get(d.contractId)||{}).title||""):""];
    case "budget": return [sp, catName(d.space,"out",d.cat), d.limit];
    case "goal": return [sp, d.name, d.target, d.saved, d.deadline||""];
    case "contact": return [d.name, d.phone||"", d.email||""];
    case "debt": { const paid = (d.payments||[]).reduce((s,p)=>s+p.amount,0); return [d.direction==="owe"?"Je dois":"On me doit", contactName(d.contactId), d.label||"", d.amount, paid, d.amount-paid, d.dueDate||""]; }
    case "contract": return [contactName(d.clientId), d.title, d.amount, d.startDate||"", d.status||""];
    case "account": return [d.bank, d.name||"", d.openingBalance, d.openingDate];
    case "bankmv": return [(get(d.accountId)||{}).bank||"", {dep:"Dépôt",ret:"Retrait",adj:"Ajustement"}[d.type], d.date, d.amount, d.note||""];
    case "loan": return [d.bank, d.label, d.principal, d.rate, d.months, Math.round(d.monthly||pmt(d.principal,d.rate,d.months)), d.startDate];
    default: return [];
  }
}
const store = {
  async save(id, data){
    if (!realOnly(id)) { toast("C'est un exemple. Ajoute tes propres données pour commencer."); return false; }
    const doc = Object.assign({}, data, {_u: Date.now()});
    state.docs.set(id, doc);
    outbox[id] = {id, kind:doc.kind, data:doc, readable:readable(id, doc), _u:doc._u};
    persistAll(); render(); scheduleSync(); return true;
  },
  async saveMany(items){
    const u = Date.now();
    items.forEach(([id, d]) => { const doc = Object.assign({}, d, {_u:u}); state.docs.set(id, doc); outbox[id] = {id, kind:doc.kind, data:doc, readable:readable(id, doc), _u:u}; });
    persistAll(); render(); scheduleSync(); return true;
  },
  async remove(id){
    if (!realOnly(id)) { toast("C'est un exemple : il disparaîtra dès que tu ajoutes tes données."); return false; }
    const prev = state.docs.get(id); if (!prev) return true;
    state.docs.delete(id);
    outbox[id] = {id, kind:prev.kind, del:true, _u:Date.now()};
    persistAll(); render(); scheduleSync(); return true;
  }
};

/* ================= Calculations ================= */
function txs(pred, src){ return list("tx", pred, src).sort((a,b)=> b.date.localeCompare(a.date) || (b.createdAt||0)-(a.createdAt||0)); }
function totals(arr){ let i=0,o=0; arr.forEach(t => t.type==="in" ? i+=t.amount : o+=t.amount); return {in:i,out:o,net:i-o}; }
function titheCalc(ym, src){
  const s = src ? {titheBase:"global",tithePct:10} : settings();
  const base = list("tx", t => t.date.startsWith(ym) && !t.titheMonth && (s.titheBase==="global" || t.space===s.titheBase), src);
  const profit = totals(base).net;
  const due = Math.max(0, Math.round(profit * (s.tithePct||10) / 100));
  const paid = list("tx", t => t.titheMonth===ym, src).reduce((a,t)=>a+t.amount,0);
  return {profit, due, paid, rest: Math.max(0, due-paid)};
}
function debtInfo(d){ const paid = (d.payments||[]).reduce((s,p)=>s+p.amount,0); const rest = Math.max(0, d.amount-paid);
  let st = "ok", lbl = "À jour";
  if (rest<=0) { st="ok"; lbl="Soldé"; }
  else if (d.dueDate && d.dueDate < TODAY) { st="bad"; lbl="En retard"; }
  else if (d.dueDate && d.dueDate <= addDays(TODAY,7)) { st="warn"; lbl="Bientôt"; }
  else { st="info"; lbl="En cours"; }
  return {paid, rest, st, lbl, pct: d.amount ? Math.min(1, paid/d.amount) : 0};
}
function contractInfo(c){ const t = txs(x => x.contractId===c.id); const cashed = t.filter(x=>x.type==="in").reduce((s,x)=>s+x.amount,0); const costs = t.filter(x=>x.type==="out").reduce((s,x)=>s+x.amount,0);
  return {t, cashed, costs, rest: Math.max(0,c.amount-cashed), profit: cashed-costs, margin: cashed ? (cashed-costs)/cashed : 0, pct: c.amount ? Math.min(1,cashed/c.amount) : 0}; }
function accBalance(a){ let b = Number(a.openingBalance)||0;
  list("bankmv", m => m.accountId===a.id).forEach(m => b += m.type==="ret" ? -m.amount : m.amount);
  txs(t => t.accountId===a.id && t.date>=a.openingDate).forEach(t => b += t.type==="in" ? t.amount : -t.amount);
  return b; }
function loanInfo(l){
  const monthly = Number(l.monthly) || pmt(l.principal, l.rate, l.months);
  const paid = txs(t => t.loanId===l.id).reduce((s,t)=>s+t.amount,0);
  const k = Math.min(l.months, Math.floor(paid/monthly + 0.005));
  const r = l.rate/100/12; let bal = l.principal; const rows = [];
  for (let i=1;i<=l.months;i++){ const int = bal*r; let pr = monthly-int; if (i===l.months) pr = bal; bal = Math.max(0, bal-pr); rows.push({i, date:addMonths(l.startDate,i-1), pay: i===l.months ? pr+int : monthly, int, pr, bal}); }
  const remaining = k>0 ? rows[k-1].bal : l.principal;
  const next = k < l.months ? rows[k] : null;
  return {monthly, paid, k, rows, remaining, next, total: rows.reduce((s,x)=>s+x.pay,0)};
}
function reminders(){
  const out = [], s = settings(), lim = addDays(TODAY, Math.max(3, s.remindDays||3));
  list("debt").forEach(d => { const di = debtInfo(d); if (di.rest>0 && d.dueDate && d.dueDate <= lim) out.push({icon: d.direction==="owe"?"up":"down", tone: d.dueDate<TODAY?"bad":"warn",
    title: d.direction==="owe" ? `Rembourser ${contactName(d.contactId)}` : `${contactName(d.contactId)} doit te rembourser`,
    sub: `${money(di.rest)} · ${d.dueDate<TODAY?"en retard depuis le":"échéance le"} ${dateTxt(d.dueDate,{day:"numeric",month:"short"})}`, go:{s:"debt",id:d.id}, date:d.dueDate}); });
  list("loan").forEach(l => { const li = loanInfo(l); if (li.next && li.next.date <= lim) out.push({icon:"bank", tone: li.next.date<TODAY?"bad":"warn", title:`Échéance ${li.next.i}/${l.months} · ${l.label}`, sub:`${money(li.monthly)} · ${li.next.date<TODAY?"en retard depuis le":"le"} ${dateTxt(li.next.date,{day:"numeric",month:"short"})}`, go:{s:"loan",id:l.id}, date:li.next.date}); });
  const pm = shiftYM(ymOf(NOW),-1), tc = titheCalc(pm);
  if (tc.rest>0) out.push({icon:"church", tone:"gold", title:`Dîme de ${monthName(pm,{month:"long"})}`, sub:`${money(tc.rest)} à donner (${settings().tithePct} % du bénéfice)`, go:{s:"dime"}, date:pm+"-28"});
  list("contract", c => c.status!=="terminé").forEach(c => { const ci = contractInfo(c); if (c.endDate && c.endDate < TODAY && ci.rest>0) out.push({icon:"contract", tone:"warn", title:`Solde client · ${c.title}`, sub:`${money(ci.rest)} restent à encaisser`, go:{s:"contract",id:c.id}, date:c.endDate}); });
  return out.sort((a,b)=>a.date.localeCompare(b.date));
}

SCREENS.budgets = () => {

  return `<header class="hero subhero"><div class="hrow"><button class="iconbtn" data-act="back" aria-label="Retour">${ic("back")}</button>${spaceSeg()}</div><div><h1>Budgets</h1>${monthNav()}</div></header><div class="panel">
    <section class="card">${withB.length ? withB.map(([k,n]) => { const s = spent[k]||0, l = bud[k].limit, st = bStatus(s,l);
      return `<div style="display:flex;flex-direction:column;gap:7px"><div class="ch"><b>${esc(n)}</b><span class="pill ${st==="ok"?"ok":st}">${STATUS[st]}</span></div><div class="bar ${st==="ok"?"":st}"><i style="width:${Math.min(100,s/l*100)}%"></i></div>
      <div class="ch small muted num"><span>${money(s)} sur ${money(l)}</span><button class="link" data-act="budget" data-v="${k}">Modifier</button></div></div>`; }).join("") : `<p class="empty">Aucun plafond défini.</p>`}</section>

};
SCREENS.epargne = () => {

  ${gs.map(g => { const p = Math.min(1,g.saved/g.target); return `<section class="card"><div class="ch"><h2>${esc(g.name)}</h2><span class="pill ${p>=1?"ok":"gold"}">${p>=1?"Atteint":Math.round(p*100)+" %"}</span></div>
    <div class="ch num"><b style="font-size:22px">${money(g.saved)}</b><span class="muted small">sur ${money(g.target)}</span></div><div class="bar gold"><i style="width:${p*100}%"></i></div>
    <p class="small muted num" style="margin:0">${p>=1?"Objectif atteint.":"Reste "+money(g.target-g.saved)}${g.deadline?" · échéance "+esc(dateTxt(g.deadline)):""}</p>

  <button class="btn wide" data-act="goal" data-id="new">${ic("plus")}Nouvel objectif</button></div>`;
};
SCREENS.bilans = () => {
  const mtx = txs(t => t.space===state.space && t.date.startsWith(state.month)), spent = {};
  mtx.filter(t=>t.type==="out").forEach(t => spent[t.cat]=(spent[t.cat]||0)+t.amount);
  return `<header class="hero subhero"><div class="hrow"><button class="iconbtn" data-act="back" aria-label="Retour">${ic("back")}</button>${spaceSeg()}</div><div><h1>Bilans</h1>${monthNav()}</div></header><div class="panel">
    <section class="card"><h2>Où part l'argent</h2>${donut(spent)}</section><section class="card"><h2>6 derniers mois</h2>${bars()}</section></div>`;
};
function donut(spent){
  const e = Object.entries(spent).sort((a,b)=>b[1]-a[1]), total = e.reduce((s,x)=>s+x[1],0);
  if (!total) return `<p class="empty">Aucune dépense ce mois-ci.</p>`;
  const R = 50, C = 2*Math.PI*R; let off = 0;
  const arcs = e.map(([k,v]) => { const len = v/total*C; const s = `<circle cx="65" cy="65" r="${R}" fill="none" stroke="${catColor(state.space,"out",k)}" stroke-width="20" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 65 65)"/>`; off += len; return s; }).join("");
  return `<div class="donutwrap"><svg viewBox="0 0 130 130" width="130" height="130" role="img" aria-label="Répartition des dépenses"><circle cx="65" cy="65" r="${R}" fill="none" stroke="var(--sunk)" stroke-width="20"/>${arcs}
    <text x="65" y="62" text-anchor="middle" style="fill:var(--muted);font-size:11px;font-family:var(--font)">Total</text><text x="65" y="80" text-anchor="middle" style="fill:var(--ink);font-size:15px;font-weight:800;font-family:var(--font)">${fmt(total/1000)}k</text></svg>
    <ul class="legend">${e.map(([k,v])=>`<li><i class="dot" style="background:${catColor(state.space,"out",k)}"></i><span>${esc(catName(state.space,"out",k))}</span><span class="num">${fmt(v)} <span class="muted small">${Math.round(v/total*100)}%</span></span></li>`).join("")}</ul></div>`;
}
function niceStep(x){ const p = Math.pow(10, Math.floor(Math.log10(x||1))), n = x/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }
function bars(){
  const months = []; for (let i=5;i>=0;i--) months.push(shiftYM(state.month,-i));
  const data = months.map(m => totals(txs(t => t.space===state.space && t.date.startsWith(m))));
  const maxV = Math.max(1, ...data.map(d=>Math.max(d.in,d.out))), step = niceStep(maxV/3), topV = Math.ceil(maxV/step)*step;
  const W=340,H=170,L=40,B=24,T=8,ch=H-B-T,gw=(W-L)/6,bw=Math.min(15,gw/3.3), y = v => T+ch-v/topV*ch;
  let g = "";
  for (let v=0; v<=topV+1; v+=step) g += `<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v>=1e6?(v/1e6).toLocaleString("fr-FR")+"M":fmt(v/1000)+"k"}</text>`;
  data.forEach((d,i) => { const cx = L+gw*i+gw/2, cur = months[i]===state.month;
    g += `<rect x="${cx-bw-1.5}" y="${y(d.in)}" width="${bw}" height="${Math.max(0,T+ch-y(d.in))}" rx="4" fill="var(--c3)" opacity="${cur?1:.7}"/><rect x="${cx+1.5}" y="${y(d.out)}" width="${bw}" height="${Math.max(0,T+ch-y(d.out))}" rx="4" fill="var(--c1)" opacity="${cur?1:.7}"/>
    <text x="${cx}" y="${H-6}" text-anchor="middle" style="${cur?"fill:var(--ink);font-weight:800":""}">${esc(monthName(months[i],{month:"short"}).replace(".",""))}</text>`; });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Revenus et dépenses sur six mois">${g}</svg></div><div class="chips small muted" style="gap:14px"><span><i class="dot" style="background:var(--c3)"></i> Revenus</span><span><i class="dot" style="background:var(--c1)"></i> Dépenses</span></div>`;
}

async function connect(){
  const url = $("#cfgUrl").value.trim(), key = $("#cfgKey").value.trim(), err = $("#cfgErr");
  const fail = m => { err.textContent = m; err.hidden = false; };
  if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(url)) return fail("L'adresse doit ressembler à https://script.google.com/macros/s/…/exec");
  if (key.length < 16) return fail("Colle la clé secrète complète.");
  if (!navigator.onLine) return fail("Il faut une connexion internet pour la première connexion.");
  const btn = document.querySelector('[data-act="connect"]'); btn.disabled = true; btn.textContent = "Connexion…";
  const old = cfg; cfg = {url, key};
  try { const r = await api("ping"); cfg.email = r.email; cfg.sheetUrl = r.sheetUrl; ls.set(K.cfg, cfg); state.email = r.email || ""; state.sheetUrl = r.sheetUrl || "";
    if (!usingSamples()) [...state.docs].forEach(([id, d]) => { if (!outbox[id]) outbox[id] = {id, kind:d.kind, data:d, readable:readable(id, d), _u:d._u || 1}; });
    persistAll(); toast("Connecté à " + (r.email || "ton Google Sheets")); render(); sync(); }
  catch(e){ cfg = old; btn.disabled = false; btn.textContent = "Connecter et synchroniser"; fail(e.name === "AbortError" ? "Le serveur ne répond pas. Réessaie." : e.message === "Failed to fetch" ? "Serveur injoignable : vérifie l'adresse et que l'accès est « Tout le monde »." : e.message); }
}

function openSheet(html, mount){
  $("#sheetRoot").innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`;
  $("#scrim").addEventListener("click", e => { if (e.target.id==="scrim" || e.target.closest("[data-close]")) closeSheet(); });
  const sh = $("#sheetRoot .sheet"); mount && mount(sh);
}
function closeSheet(){ $("#sheetRoot").innerHTML = ""; }
document.addEventListener("keydown", e => { if (e.key==="Escape") closeSheet(); });
const parseAmt = v => Number(String(v).replace(/[^\d-]/g,"")) || 0;

/* fields: {id,label,type:amount|text|date|select|seg|contact|tel|email|number, options(arr|fn), value, required, show(vals)} */
function form({title, intro, fields, submit="Enregistrer", onSubmit, danger}){
  const optHtml = (f, vals) => { const o = typeof f.options==="function" ? f.options(vals) : f.options; return o.map(([v,l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join(""); };
  const fieldHtml = f => {
    const lab = `<label for="ff-${f.id}">${esc(f.label)}</label>`;
    if (f.type==="seg") return `<div class="field" data-f="${f.id}">${f.label?`<label>${esc(f.label)}</label>`:""}<div class="segf" id="ff-${f.id}">${f.options.map(([v,l])=>`<button type="button" data-seg="${esc(v)}">${esc(l)}</button>`).join("")}</div></div>`;
    if (f.type==="select") return `<div class="field" data-f="${f.id}">${lab}<select id="ff-${f.id}"></select></div>`;
    if (f.type==="contact") return `<div class="field" data-f="${f.id}">${lab}<select id="ff-${f.id}"><option value="">${f.optional?"— Aucun —":"Choisir…"}</option>${contactsReal().map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join("")}<option value="__new">+ Nouveau contact…</option></select><input id="ff-${f.id}-new" placeholder="Nom du nouveau contact" hidden maxlength="60"></div>`;
    const type = f.type==="amount"||f.type==="number" ? "text" : f.type;
    return `<div class="field" data-f="${f.id}">${lab}<input id="ff-${f.id}" type="${type}" ${f.type==="amount"?'class="amount num" inputmode="numeric" placeholder="0"':f.type==="number"?'inputmode="decimal" class="num"':""} ${f.placeholder?`placeholder="${esc(f.placeholder)}"`:""} ${f.max?`max="${f.max}"`:""} autocomplete="off"></div>`;
  };
  const rows = []; for (let i=0;i<fields.length;i++){ const f = fields[i]; if (f.half && fields[i+1] && fields[i+1].half) { rows.push(`<div class="two">${fieldHtml(f)}${fieldHtml(fields[i+1])}</div>`); i++; } else rows.push(fieldHtml(f)); }
  openSheet(`<h3>${esc(title)}</h3>${intro?`<p class="small muted" style="margin:0">${intro}</p>`:""}${rows.join("")}<p class="err" hidden></p><button class="btn wide" data-submit>${esc(submit)}</button>${danger?`<button class="btn danger wide" data-danger>${esc(danger.label)}</button>`:""}`, sh => {
    const vals = {}; fields.forEach(f => vals[f.id] = f.value ?? (f.type==="seg" ? f.options[0][0] : ""));
    const el = id => sh.querySelector("#ff-"+id);
    const sync = () => {
      fields.forEach(f => {
        const wrap = sh.querySelector(`[data-f="${f.id}"]`);
        if (f.show) wrap.hidden = !f.show(vals);
        if (f.type==="select") { const s = el(f.id), html = optHtml(f, vals); if (s.dataset.h !== html) { s.innerHTML = html; s.dataset.h = html; const o = [...s.options].map(x=>x.value); if (!o.includes(String(vals[f.id]))) vals[f.id] = o[0] ?? ""; s.value = vals[f.id]; } }
        if (f.type==="seg") el(f.id).querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.seg===String(vals[f.id])));
        if (f.type==="contact") el(f.id+"-new").hidden = vals[f.id]!=="__new";
      });
    };
    fields.forEach(f => {
      const e = el(f.id);
      if (f.type==="seg") e.addEventListener("click", ev => { const b = ev.target.closest("[data-seg]"); if (b) { vals[f.id] = b.dataset.seg; sync(); } });
      else { if (f.type==="amount" && vals[f.id]!=="") e.value = fmt(vals[f.id]); else if (f.type!=="select") e.value = vals[f.id] ?? "";
        if (f.type==="contact") vals[f.id] = e.value;
        e.addEventListener("input", () => { if (f.type==="amount") { const n = parseAmt(e.value); e.value = n ? fmt(n) : ""; vals[f.id] = n; } else vals[f.id] = e.value; sync(); });
        e.addEventListener("change", () => { vals[f.id] = f.type==="amount" ? parseAmt(e.value) : e.value; sync(); }); }
    });
    sync();
    const first = sh.querySelector("input:not([hidden]),select"); if (first && first.type!=="date") setTimeout(()=>first.focus({preventScroll:true}), 60);
    const err = sh.querySelector(".err");
    sh.querySelector("[data-submit]").addEventListener("click", async () => {
      fields.forEach(f => { if (f.type==="contact") vals[f.id+"_new"] = el(f.id+"-new").value.trim(); });
      for (const f of fields) {
        if (f.show && !f.show(vals)) continue;
        const v = vals[f.id];
        if (f.required && (f.type==="amount" ? !(v>0) : f.type==="contact" ? !(v && (v!=="__new" || vals[f.id+"_new"])) : !String(v||"").trim())) { err.textContent = f.msg || `Renseigne : ${f.label.toLowerCase()}.`; err.hidden = false; return; }
      }
      const r = await onSubmit(vals); if (r !== false) closeSheet();
    });
    if (danger) { const d = sh.querySelector("[data-danger]"); d.addEventListener("click", async () => { if (!d.dataset.armed) { d.dataset.armed = "1"; d.textContent = "Appuie encore pour confirmer"; return; } closeSheet(); await danger.onClick(); }); }
  });
}
async function resolveContact(vals, key){
  const v = vals[key]; if (v!=="__new") return v || null;
  const name = vals[key+"_new"]; if (!name) return null;
  const id = newId("ct"); await store.save(id, {kind:"contact", name}); return id;
}

  form({title: type==="dep"?"Dépôt":type==="ret"?"Retrait":"Ajuster au relevé", intro: type==="adj" ? `Solde calculé : ${money(bal)}. Saisis le solde exact de ton relevé : l'écart sera enregistré (frais, agios…).` : `${esc(a.bank)} · solde ${money(bal)}`, fields:[
    {id:"amount", type:"amount", label: type==="adj" ? "Solde réel du relevé (F CFA)" : "Montant (F CFA)", value:"", required:true},
    {id:"date", type:"date", label:"Date", value:TODAY},
    {id:"note", type:"text", label:"Libellé (facultatif)", value: type==="adj" ? "Frais bancaires / agios" : ""}
  ], onSubmit: async v => {
    const amount = type==="adj" ? v.amount - bal : v.amount;
    if (type==="adj" && !amount) { toast("Le solde est déjà juste."); return; }
    if (await store.save(newId("mv"), {kind:"bankmv", accountId:a.id, type, amount, date:v.date||TODAY, note:v.note.trim()})) toast("Mouvement enregistré");
  }});
}
function loanForm(existing){
  const e = existing || {}, accs = list("account", null, state.docs);
  form({title: existing?"Modifier le prêt":"Nouveau prêt bancaire", fields:[
    {id:"label", type:"text", label:"Nom du prêt", value:e.label||"", required:true, placeholder:"Ex. : prêt équipement"},
    {id:"bank", type:"text", label:"Banque", value:e.bank||"", required:true},
    {id:"principal", type:"amount", label:"Capital emprunté (F CFA)", value:e.principal??"", required:true},
    {id:"rate", type:"number", label:"Taux annuel (%)", value:e.rate??"", half:true, placeholder:"9"},
    {id:"months", type:"number", label:"Durée (mois)", value:e.months??"", half:true, required:true, placeholder:"24"},
    {id:"startDate", type:"date", label:"1re échéance", value:e.startDate||addMonths(TODAY,1), required:true},
    {id:"monthly", type:"amount", label:"Mensualité de la banque (facultatif)", value:e.monthly??""},
    {id:"accountId", type:"select", label:"Prélevé sur le compte", options:[["","— Aucun —"],...accs.map(a=>[a.id,a.bank])], value:e.accountId||"", show:()=>accs.length>0}
  ], onSubmit: async v => {
    const months = parseInt(v.months,10), rate = parseFloat(String(v.rate).replace(",","."))||0;
    if (!(months>0)) { toast("Saisis une durée en mois."); return false; }
    const id = existing ? existing.id : newId("loan");
    const doc = {kind:"loan", label:v.label.trim(), bank:v.bank.trim(), principal:v.principal, rate, months, startDate:v.startDate}; if (v.monthly) doc.monthly = v.monthly; if (v.accountId) doc.accountId = v.accountId;
    if (await store.save(id, doc)) { toast("Prêt enregistré · mensualité " + money(doc.monthly||pmt(doc.principal,rate,months))); if (!existing) go({s:"loan", id}); }
  }, danger: existing && realOnly(existing.id) ? {label:"Supprimer le prêt", onClick: async()=>{ if (await store.remove(existing.id)) { toast("Prêt supprimé"); back(); } }} : null});
}
function budgetForm(cat){
  const id = `budget_${state.space}_${cat}`, cur = get(id);
  form({title:`Plafond · ${catName(state.space,"out",cat)}`, intro:`Montant maximum par mois (${esc(SPACE_NAME[state.space])}).`, fields:[{id:"limit", type:"amount", label:"Plafond mensuel (F CFA)", value:cur&&realOnly(id)?cur.limit:"", required:true}],
    onSubmit: async v => { if (await store.save(id, {kind:"budget", space:state.space, cat, limit:v.limit})) toast("Plafond enregistré"); },
    danger: cur && realOnly(id) ? {label:"Retirer le plafond", onClick: async()=>{ if (await store.remove(id)) toast("Plafond retiré"); }} : null});
}
function goalForm(id){
  const g = id!=="new" ? get(id) : null;
  form({title: g?"Modifier l'objectif":"Nouvel objectif", fields:[
    {id:"name", type:"text", label:"Nom", value:g?g.name:"", required:true, placeholder:"Ex. : fonds d'urgence"},
    {id:"target", type:"amount", label:"Cible (F CFA)", value:g?g.target:"", required:true, half:true},
    {id:"saved", type:"amount", label:"Déjà épargné", value:g?g.saved:"", half:true},
    {id:"deadline", type:"date", label:"Échéance (facultatif)", value:g&&g.deadline||""}
  ], onSubmit: async v => { if (await store.save(g&&realOnly(g.id)?g.id:newId("goal"), {kind:"goal", space:g?g.space:state.space, name:v.name.trim(), target:v.target, saved:v.saved||0, deadline:v.deadline||null})) toast("Objectif enregistré"); },
  danger: g && realOnly(g.id) ? {label:"Supprimer l'objectif", onClick: async()=>{ if (await store.remove(g.id)) toast("Objectif supprimé"); }} : null});
}
function titheSettingsForm(){
  const s = settings();
  form({title:"Réglages de la dîme", fields:[
    {id:"pct", type:"number", label:"Pourcentage", value:s.tithePct},
    {id:"base", type:"seg", label:"Bénéfice pris en compte", options:[["global","Perso + Lambano"],["pro","Lambano"],["perso","Perso"]], value:s.titheBase}
  ], onSubmit: async v => { const pct = parseFloat(String(v.pct).replace(",",".")); if (!(pct>0 && pct<=100)) { toast("Saisis un pourcentage entre 1 et 100."); return false; }
    if (await saveSettings({tithePct:pct, titheBase:v.base})) toast("Réglages enregistrés"); }});
}
async function saveSettings(patch){ const s = Object.assign({kind:"settings"}, state.docs.get("settings")||{}, patch); return store.save("settings", s); }

function addMenu(){
  const it = (act,icon,t,sub,v="") => `<button data-m="${act}" data-v="${v}"><span class="ico">${ic(icon)}</span><span><b>${t}</b><span>${sub}</span></span></button>`;
  openSheet(`<h3>Ajouter</h3><div class="menu">${it("tx","up","Dépense","Une sortie d'argent","out")}${it("tx","down","Revenu","Une entrée d'argent","in")}${it("debt","book","Dette ou créance","Au registre, avec rappel")}
    ${it("contract","contract","Contrat client","Suivi paiement, charges, bénéfice")}${it("bank","bank","Mouvement bancaire","Dépôt, retrait, ajustement")}${it("contact","user","Contact","Une personne à régler ou encaisser")}</div>`, sh => {
    sh.querySelector(".menu").addEventListener("click", e => { const b = e.target.closest("[data-m]"); if (!b) return; closeSheet();
      ({tx:()=>txForm({type:b.dataset.v}), debt:()=>debtForm(), contract:()=>contractForm(), bank:()=>{ if (list("account").length) { state.stack=[{s:"plus"},{s:"banque"}]; render(); bankmvForm("dep"); } else accountForm(); }, contact:()=>contactForm()})[b.dataset.m](); });
  });
}

/* --- Google contacts import --- */
async function importContacts(){
  if (!cfg) { toast("Connecte d'abord ton Google Sheets (Plus → Synchronisation)."); return; }
  if (!navigator.onLine) { toast("Il faut une connexion internet pour lire tes contacts Google."); return; }
  toast("Lecture de tes contacts Google…");
  let res; try { res = (await api("contacts")).contacts; } catch(e){
    const m = String(e && e.message || e);
    toast(m.includes("PEOPLE_API") ? "Active le service « People API » dans ton projet Apps Script (voir le guide)." : "Impossible de lire tes contacts. Réessaie."); return; }
  const have = new Set(contactsReal().map(c=>c.googleId).filter(Boolean));
  const fresh = res.filter(c => !have.has(c.googleId));
  if (!fresh.length) { toast(res.length ? "Tous tes contacts sont déjà importés." : "Aucun contact trouvé dans ton compte Google."); return; }
  openSheet(`<h3>Importer des contacts</h3><p class="small muted" style="margin:0">${fresh.length} contact${fresh.length>1?"s":""} Google. Coche les personnes à suivre.</p>
    <div class="field"><input id="pq" type="search" placeholder="Rechercher" aria-label="Rechercher"></div>
    <div class="pick">${fresh.map((c,i)=>`<label data-n="${esc((c.name+" "+(c.phone||"")).toLowerCase())}"><input type="checkbox" value="${i}">${avatar(c.name,c.photo,36)}<span style="min-width:0"><b style="display:block;font-size:14px">${esc(c.name)}</b><span class="small muted num">${esc(c.phone||c.email||"")}</span></span></label>`).join("")}</div>
    <button class="btn wide" id="doImport">Importer la sélection</button>`, sh => {
      sh.querySelector("#pq").addEventListener("input", e => { const q = e.target.value.toLowerCase(); sh.querySelectorAll(".pick label").forEach(l => l.hidden = q && !l.dataset.n.includes(q)); });
      sh.querySelector("#doImport").addEventListener("click", async () => {
        const sel = [...sh.querySelectorAll(".pick input:checked")].map(x => fresh[+x.value]); if (!sel.length) { toast("Coche au moins un contact."); return; }
        closeSheet();
        if (await store.saveMany(sel.map(c => [newId("ct"), {kind:"contact", name:c.name, phone:c.phone||"", email:c.email||"", photo:c.photo||"", googleId:c.googleId}]))) toast(`${sel.length} contact${sel.length>1?"s":""} importé${sel.length>1?"s":""}`);
      });
    });
}

/* --- Profile photo --- */
function resizeImage(file, max=320){ return new Promise((res,rej) => { const r = new FileReader(); r.onerror = rej; r.onload = () => { const img = new Image(); img.onerror = rej; img.onload = () => {
  const s = Math.min(1, max/Math.max(img.width,img.height)), side = Math.min(img.width,img.height), c = document.createElement("canvas"); c.width = c.height = Math.round(side*s);
  c.getContext("2d").drawImage(img, (img.width-side)/2, (img.height-side)/2, side, side, 0, 0, c.width, c.height); res(c.toDataURL("image/jpeg", .85)); }; img.src = r.result; }; r.readAsDataURL(file); }); }
async function setPhoto(file){
  let data; try { data = await resizeImage(file); } catch(e){ toast("Cette image ne peut pas être lue. Essaie une photo JPG ou PNG."); return; }
  state.photo = data; ls.set(K.photo, data); meta.photoPending = true; persistAll(); render(); scheduleSync();
  toast(cfg && navigator.onLine ? "Photo mise à jour" : "Photo enregistrée sur ce téléphone");
}

/* --- Lock --- */
async function sha(s){ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("mf:"+s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
function keypad(title, onDone){
  let code = "";
  const draw = (msg) => { $("#lockRoot").innerHTML = `<div class="lock">${avatar(settings().name||"Moi", state.photo, 76)}<div style="text-align:center"><b style="font-size:18px">${esc(title)}</b>${msg?`<div style="margin-top:6px;opacity:.85">${esc(msg)}</div>`:""}</div>
    <div class="pins">${[0,1,2,3].map(i=>`<i class="${i<code.length?"f":""}"></i>`).join("")}</div>
    <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join("")}<span></span><button data-k="0">0</button><button data-k="del" aria-label="Effacer">⌫</button></div></div>`; };
  draw();
  $("#lockRoot").onclick = async e => { const b = e.target.closest("[data-k]"); if (!b) return;
    if (b.dataset.k==="del") code = code.slice(0,-1); else if (code.length<4) code += b.dataset.k;
    draw(); if (code.length===4) { const c = code; code = ""; const r = await onDone(c); if (r) draw(r); } };
}
function showLock(){ keypad("Entre ton code", async c => { if (await sha(c) === settings().lockHash) { state.unlocked = true; $("#lockRoot").innerHTML = ""; $("#lockRoot").onclick = null; render(); return ""; } return "Code incorrect"; }); }
function setupLock(){ let first = ""; keypad("Choisis un code à 4 chiffres", async c => {
  if (!first) { first = c; return "Confirme le code"; }
  if (c !== first) { first = ""; return "Les codes ne correspondent pas. Recommence."; }
  $("#lockRoot").innerHTML = ""; $("#lockRoot").onclick = null; if (await saveSettings({lockHash: await sha(c)})) toast("Code activé"); return ""; }); }

let toastT;
function toast(msg){ let t = $(".toast"); if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role","status"); document.body.appendChild(t); } t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(()=>{ t.hidden = true; }, 3000); }

/* ================= Events ================= */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el || !$("#app").contains(el)) return;
  const a = el.dataset.act, v = el.dataset.v, id = el.dataset.id;
  const A = {
    tab: () => tab(v), back, addMenu,
    go: () => { if (v==="banque" && id) state.acc = id; go({s:v, id}); },
    goto: () => go(JSON.parse(v)),
    space: () => { state.space = v; saveUI(); render(); },
    month: () => { const n = shiftYM(state.month, +v); if (n <= ymOf(NOW)) { state.month = n; render(); } },
    filter: () => { state.filter = v; render(); },
    debtFilter: () => { state.debtFilter = v; render(); },
    newTx: () => txForm({type:v}),
    editTx: () => { const t = get(id); if (t) txForm({}, t); },
    newDebt: () => debtForm(null, id),
    editDebt: () => { if (realOnly(id)) debtForm(get(id)); else toast("C'est un exemple."); },
    debtPay: () => { const d = get(id); if (!realOnly(id)) { toast("C'est un exemple. Ajoute ta propre ligne au registre."); return; } debtPayForm(d); },
    delPayment: async () => { const d = get(id); if (!d || !realOnly(id)) return; if (!el.dataset.armed) { el.dataset.armed="1"; el.textContent="Confirmer"; el.style.color="var(--bad)"; return; } const {id:_, ...body} = d; await store.save(id, {...body, payments:(d.payments||[]).filter(p=>p.id!==v)}); },
    delDebt: async () => { if (!el.dataset.armed) { el.dataset.armed="1"; el.lastChild.textContent = "Appuie encore pour supprimer"; return; } if (await store.remove(id)) { toast("Ligne supprimée"); back(); } },
    newContract: () => contractForm(),
    editContract: () => { if (realOnly(id)) contractForm(get(id)); else toast("C'est un exemple."); },
    contractTx: () => { const c = get(id); if (!realOnly(id)) { toast("C'est un exemple. Crée ton propre contrat."); return; }
      txForm({type:v, space:"pro", contractId:c.id, contactId: v==="in" ? c.clientId : "", cat: v==="in" ? "event" : "prestataires", title: v==="in" ? "Encaissement client" : "Charge du contrat", intro: esc(c.title), note: v==="in" ? "Paiement " + c.title : ""}); },
    toggleContract: async () => { const c = get(id); const {id:_, ...body} = c; if (await store.save(id, {...body, status: c.status==="terminé" ? "en cours" : "terminé"})) toast("Statut mis à jour"); },
    payTithe: () => { const tc = titheCalc(v); txForm({type:"out", space:"perso", cat:"dime", amount:tc.rest, titheMonth:v, note:"Dîme " + monthName(v), date: TODAY, title:"Donner la dîme", intro:`${esc(monthName(v))} · ${settings().tithePct} % de ${money(Math.max(0,tc.profit))} de bénéfice`}); },
    titheSettings: titheSettingsForm,
    budget: () => budgetForm(v), goal: () => goalForm(id),
    goalAdd: () => { const g = get(id); if (!realOnly(id)) { toast("C'est un exemple. Crée ton propre objectif."); return; }
      form({title:"Versement · "+g.name, fields:[{id:"amount", type:"amount", label:"Montant (F CFA)", value:"", required:true}], submit:"Ajouter", onSubmit: async v2 => { const {id:_, ...body} = g; if (await store.save(id, {...body, saved:(g.saved||0)+v2.amount})) toast("Versement ajouté"); }}); },
    selAcc: () => { state.acc = id; render(); },
    account: () => { if (id==="new") accountForm(); else if (realOnly(id)) accountForm(get(id)); else toast("C'est un exemple."); },
    bankmv: () => bankmvForm(v),
    delMv: async () => { if (!realOnly(id)) { toast("C'est un exemple."); return; } if (!el.dataset.armed) { el.dataset.armed = "1"; toast("Appuie encore sur ce mouvement pour le supprimer."); setTimeout(()=>{ delete el.dataset.armed; }, 3000); return; } if (await store.remove(id)) toast("Mouvement supprimé"); },
    loan: () => { if (id==="new") loanForm(); else if (realOnly(id)) loanForm(get(id)); else toast("C'est un exemple."); },
    loanPay: () => { const l = get(id); if (!realOnly(id)) { toast("C'est un exemple. Ajoute ton propre prêt."); return; } const li = loanInfo(l);
      txForm({type:"out", space:"perso", cat:"pret", amount:Math.round(li.monthly), loanId:l.id, method: l.accountId ? "Banque" : "Espèces", accountId:l.accountId||"", date: li.next.date<=TODAY ? li.next.date : TODAY, note:`Échéance ${li.next.i}/${l.months} · ${l.label}`, title:"Payer l'échéance", intro:`${esc(l.bank)} · échéance du ${esc(dateTxt(li.next.date))}`}); },
    importContacts, contact: () => contactForm(id==="new" ? null : get(id)),
    connect, syncNow: () => { if (!navigator.onLine) toast("Pas de connexion pour l'instant : la synchro se fera automatiquement au retour du réseau."); else sync(); },
    hideTip: () => { meta.hideTip = true; persistAll(); render(); },
    disconnect: () => { if (!el.dataset.armed) { el.dataset.armed = "1"; el.textContent = "Appuie encore pour confirmer"; return; } cfg = null; ls.del(K.cfg); outbox = {}; meta.lastSync = 0; persistAll(); toast("Ce téléphone n'est plus synchronisé"); render(); },
    saveName: async () => { const n = $("#pName").value.trim(); if (await saveSettings({name:n})) toast("Nom enregistré"); }
  };
  if (A[a]) { e.preventDefault(); A[a](); }
});
document.addEventListener("input", e => { if (e.target.id==="q") { state.q = e.target.value; const pos = e.target.selectionStart; render(); const q = $("#q"); q.focus(); try { q.setSelectionRange(pos,pos); } catch(_){} } });
document.addEventListener("change", async e => {
  const t = e.target;
  if (t.id==="photoIn" && t.files[0]) setPhoto(t.files[0]);
  if (t.id==="swLock") { if (t.checked) setupLock(); else if (await saveSettings({lockHash:""})) toast("Code désactivé"); }
  if (t.id==="remDays") { if (await saveSettings({remindDays:+t.value})) toast("Réglage enregistré"); }
  if (t.id==="swMail") { const on = t.checked; if (!cfg || !navigator.onLine) { t.checked = !on; toast("Il faut une connexion internet pour régler les rappels par e-mail."); return; } try { await api("reminders", {on}); await saveSettings({remindEmail:on}); toast(on ? "Rappels par e-mail activés (7 h chaque matin)" : "Rappels par e-mail désactivés"); } catch(err){ t.checked = !on; toast("Impossible de régler les rappels. Réessaie."); } }
});

SAMPLES = makeSamples();
window.addEventListener("online", () => sync());
window.addEventListener("offline", syncUI);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") sync(); });
setInterval(() => { if (document.visibilityState === "visible") sync(); else syncUI(); }, 60000);
if ("serviceWorker" in navigator && location.protocol === "https:" && window.top === window) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
render();
boot();
})();
